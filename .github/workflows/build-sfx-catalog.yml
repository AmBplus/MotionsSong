name: Build 200 SFX Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "catalog-trigger.txt"
      - "scripts/build-sfx-catalog.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build catalog
        run: python scripts/build-sfx-catalog.py
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/sfx-catalog-200.json
          git commit -m "Build 200-item motion SFX catalog" || exit 0
          git push
