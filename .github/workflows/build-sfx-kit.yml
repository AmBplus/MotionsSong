name: Build SFX Kit

on:
  workflow_dispatch:
  push:
    paths:
      - ".sfx-build-trigger"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build curated CC0 kit
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: python scripts/build_sfx_kit.py

      - name: Commit generated kit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sfx dist
          git commit -m "Build curated motion SFX kit" || exit 0
          git push

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionsSong-SFX-Kit
          path: dist/MotionsSong-SFX-Kit.zip
          if-no-files-found: error
